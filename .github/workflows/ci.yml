name: CI

# 三件事：工具回归测试、研究索引是否过期、Codex 生成物是否与 skills/ 同步。
# 全部零外部依赖，不联网取数。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # reports_index.py 用 git 提交时间做日期兜底，需要完整历史
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 工具回归测试（tests/）
        run: python3 -m unittest discover -s tests -v

      - name: 研究索引是否过期（reports/README.md、index.json、根 README 索引块）
        run: python3 tools/reports_index.py --check

      - name: Codex skills 是否与 skills/ 同步
        run: python3 scripts/sync-codex-skills.py --check

      - name: Codex prompts 是否与 skills/ 同步
        run: python3 scripts/sync-codex-prompts.py --check
